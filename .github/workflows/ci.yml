name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Varre todo o historico atras de chaves e tokens commitados por engano
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Nenhuma variavel publica (NEXT_PUBLIC_) pode carregar segredo
      - name: Guard public env names
        run: |
          if grep -rEn "NEXT_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN)" src .env.example; then
            echo "::error::Segredo exposto com prefixo NEXT_PUBLIC_"; exit 1
          fi

      - name: Build
        run: npm run build

      # Prova de que a chave do Gemini nao chega ao navegador
      - name: Client bundle has no secrets
        run: |
          if grep -rEl "GEMINI_API_KEY|x-goog-api-key|N8N_WEBHOOK_SECRET|INTERNAL_SIGNING_SECRET" .next/static; then
            echo "::error::Referencia a segredo encontrada no bundle do cliente"; exit 1
          fi
          echo "Bundle do cliente limpo"
